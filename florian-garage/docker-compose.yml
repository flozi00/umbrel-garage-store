version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: florian-garage_webui_1
      APP_PORT: 3909

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    user: "1000:1000"
    restart: on-failure
    command: ["/garage", "server", "--single-node"]
    environment:
      GARAGE_RPC_SECRET: ${APP_SEED}
      GARAGE_ADMIN_TOKEN: ${APP_SEED}
    ports:
      - "3900:3900" # S3 API
    volumes:
      - ${APP_DATA_DIR}/garage.toml:/etc/garage.toml:ro
      - ${APP_DATA_DIR}/data/meta:/var/lib/garage/meta
      - ${APP_DATA_DIR}/data/data:/var/lib/garage/data

  webui:
    image: khairul169/garage-webui:1.1.0@sha256:17c793551873155065bf9a022dabcde874de808a1f26e648d4b82e168806439c
    restart: on-failure
    environment:
      API_BASE_URL: http://florian-garage_garage_1:3903
      API_ADMIN_KEY: ${APP_SEED}
      S3_ENDPOINT_URL: http://florian-garage_garage_1:3900
      S3_REGION: garage
    volumes:
      - ${APP_DATA_DIR}/garage.toml:/etc/garage.toml:ro
    depends_on:
      - garage
