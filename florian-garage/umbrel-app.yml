manifestVersion: 1
id: florian-garage
name: Garage
tagline: Self-hosted S3-compatible object storage
icon: https://garagehq.deuxfleurs.fr/images/garage-logo.svg
category: files
version: "2.4.1-2"
port: 8080
description: >-
  Garage is a lightweight, S3-compatible distributed object storage server.
  This app runs it as a single node with persistent storage, plus Garage UI
  (github.com/Noooste/garage-ui) to manage buckets, access keys and files.


  S3 endpoint: http://umbrel.local:3900 (region: garage).
  On first start, use the Cluster tab in Garage UI to assign this node to the
  layout (zone dc1) and apply the layout. Create an access key and a bucket
  in the web UI, then point any S3 client at it.
developer: Deuxfleurs
website: https://garagehq.deuxfleurs.fr
submitter: Florian
submission: https://github.com/flozi00/umbrel-garage-store
repo: https://git.deuxfleurs.fr/Deuxfleurs/garage
support: https://git.deuxfleurs.fr/Deuxfleurs/garage/issues
gallery: []
releaseNotes: "Fix: garage no longer refuses to start ('layout version is already superior to 1') after any cluster layout change. Run garage in full mode; Garage UI's layout editor handles initial setup."
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
