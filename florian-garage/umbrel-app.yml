description: >-
  Garage is a lightweight, S3-compatible distributed object storage server.
  This app runs it as a single node with persistent storage, plus a web UI
  to manage buckets and access keys.


  S3 endpoint: http://umbrel.local:3900 (region: garage).
  Create an access key and a bucket in the web UI, then point any S3 client at it.
