repo: https://github.com/nesquena/hermes-webui
support: https://github.com/nesquena/hermes-webui/issues
port: 18791
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
installSize: 421000000
