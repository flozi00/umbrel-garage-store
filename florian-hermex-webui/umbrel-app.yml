manifestVersion: "1.1"
id: florian-hermex-webui
category: ai
name: Hermex WebUI
version: "1.0.0"
tagline: iPhone-ready chat WebUI for your Hermes agent (Hermex companion)
icon: https://getumbrel.github.io/umbrel-apps-gallery/hermes-agent/icon.svg
description: >-
  Browser and iPhone chat interface for the Hermes Agent on this Umbrel. This app
  runs the community hermes-webui server (github.com/nesquena/hermes-webui) as
  a sidecar to the "Hermes Agent" app: it shares the same agent home (sessions,
  memory, skills, cron) while serving a dedicated chat UI with password login.


  Point the Hermex iPhone app (github.com/uzairansaruzi/hermex) at
  https://umbrel.tailac8bf.ts.net:8443 with this app's password, or open the
  app tile on your LAN to chat from any browser.


  Tailscale Serve (8443 -> 8787) is managed on the Umbrel host, outside this app.


  ## Notes


    - The password shown on this app's page is the hermes-webui login

    - Agent home is shared with the "Hermes Agent" Umbrel app

    - Hermex (iPhone app) is optional — the WebUI also works standalone
developer: nesquena (WebUI), Uzair Ansari (Hermex)
website: https://github.com/nesquena/hermes-webui
