version: "3.7"

services:
  app_proxy:
    environment:
      # LAN tile via umbrel middleware (umbrel.local:18791, behind umbrel login)
      APP_HOST: hermex-webui_web_1
      APP_PORT: 8787

  web:
    image: ghcr.io/nesquena/hermes-webui@sha256:daa38097ab602e4e7af757a8b1f2e3107ae50074634ff6fa58b8db830ee9da13
    restart: on-failure
    stop_grace_period: 1m
    ports:
      # Loopback bind on the host; served to the tailnet by Tailscale Serve (8443->8787).
      - "127.0.0.1:8787:8787"
    volumes:
      # Shared agent home (rw) — the same home the "Hermes Agent" app serves.
      # Cross-app mount by absolute path: umbrelOS only validates ${APP_DATA_DIR}/data
      # sources, so this passes through untouched. Must match hermes-agent's data dir.
      - /home/umbrel/umbrel/app-data/hermes-agent/data/hermes:/home/hermeswebui/.hermes
      # Agent source + venv (ro) — provisioned by the pre-start hook, refreshed on agent updates.
      - ${APP_DATA_DIR}/data/agent-src/hermes:/opt/hermes:ro
    environment:
      HERMES_HOME: /home/hermeswebui/.hermes
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_AGENT_DIR: /opt/hermes
      HERMES_WEBUI_PYTHON: /opt/hermes/.venv/bin/python3
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      HERMES_WEBUI_PASSWORD: ${APP_PASSWORD}
      HERMES_WEBUI_SKIP_ONBOARDING: "1"
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      WANTED_UID: "1000"
      WANTED_GID: "1000"